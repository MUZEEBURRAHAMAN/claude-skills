<!doctype html><html><head><title>Sign up</title><style>
body{font-family:sans-serif;background:#fff}.card{max-width:360px;margin:40px auto}

.hint{color:#c8c8c8;font-size:12px}.cta{background:#9ae6b4;color:#fff;border:0;padding:8px 14px}

</style></head><body><div class="card"><button class="close" id="close"><svg width="12" height="12"><path d="M0 0L12 12M12 0L0 12" stroke="#999"/></svg></button>
