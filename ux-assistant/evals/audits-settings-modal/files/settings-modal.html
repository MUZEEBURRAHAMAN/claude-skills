<!doctype html><html><head><meta charset="utf-8"><title>Settings</title>
<style>.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4)}.modal{background:#fff;width:420px;margin:80px auto;padding:24px;border-radius:12px;font:14px Arial}
.hint{color:#b5b5b5;font-size:12px}.switch{display:inline-block;width:36px;height:20px;border-radius:10px;background:#ccc;cursor:pointer}.switch.on{background:#3b82f6}
.btn{display:inline-block;background:#3b82f6;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer}.toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:10px 14px;display:none}</style></head><body>
<div class="overlay"><div class="modal">
<h3>Notification settings</h3>
<p>Email digests <span class="switch on" onclick="this.classList.toggle('on')"></span></p>
<p class="hint">We send a summary every Monday.</p>
<p>Push alerts <span class="switch" onclick="this.classList.toggle('on')"></span></p>
<div class="btn" onclick="document.querySelector('.toast').style.display='block'">Save</div>
<span onclick="this.closest('.overlay').remove()" style="float:right;cursor:pointer">✕</span>
</div></div>
<div class="toast">Saved</div>
</body></html>
